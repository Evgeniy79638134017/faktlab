<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Профнавигатор · QR для зала</title><style>*{box-sizing:border-box}body{margin:0;background:#fffdf2;color:#173a42;font:22px/1.5 Segoe UI,Arial,sans-serif}.screen{max-width:1440px;min-height:100vh;margin:auto;padding:45px 65px;display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center}.label{font-size:16px;letter-spacing:.13em;text-transform:uppercase;color:#117c8b}h1{font-size:clamp(40px,5vw,68px);line-height:1.06;letter-spacing:-.04em;margin:22px 0}.code{width:360px;max-width:100%;background:#fff;border:1px solid #c6dedb;border-radius:18px;padding:12px;box-shadow:0 15px 40px #1a4e5212}.code img{display:block;width:100%}.url{display:block;color:#285a9b;font-size:20px;overflow-wrap:anywhere;margin:20px 0;text-underline-offset:5px}.art img{width:100%;max-height:740px;object-fit:contain;border-radius:25px;box-shadow:0 20px 60px #18444422}.small{font-size:17px;color:#526e72}ol{padding-left:25px;font-size:20px}@media(max-width:750px){.screen{padding:30px 24px;grid-template-columns:1fr}.art{display:none}h1{font-size:45px}.code{width:320px}}</style></head><body><main class="screen"><section><div class="label">ИИщенко LAB · ScienceOn</div><h1>Примерь<br>своё будущее.</h1><p>Наведи камеру на QR и собери личную карту первых проб.</p><div class="code"><img src="qr.svg" alt="QR-код опросника"></div><a class="url" href="https://faktlab.ru/scienceon/profnav/">faktlab.ru/scienceon/profnav/</a><ol><li>Распредели фишки и выбери занятия.</li><li>Наметь первую пробу.</li><li>Скачай личный PDF на телефон.</li></ol><p class="small">7–10 минут · без регистрации · ответы остаются у тебя.</p></section><figure class="art"><img src="assets/hero-professions.png" width="1122" height="1402" alt="Разные направления будущей работы"></figure></main></body></html>
