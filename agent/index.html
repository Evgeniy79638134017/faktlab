<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="referrer" content="no-referrer"><title>Личный кабинет — ИИщенко CLUB</title>
<style>body{margin:0;background:#f7faf9;color:#173568;font:17px/1.6 system-ui,sans-serif}main{max-width:540px;margin:12vh auto;padding:28px}img{width:160px;max-height:70px;object-fit:contain}h1{font-size:32px;line-height:1.2;letter-spacing:-.7px;margin:38px 0 22px}p{color:#536074}a{display:block;margin-top:26px;background:#20358a;color:#fff;padding:14px 22px;border-radius:10px;text-decoration:none;text-align:center}small{display:block;margin-top:28px;color:#738094;font-size:14px}@media(max-width:500px){main{margin:7vh auto;padding:24px}h1{font-size:28px}}</style></head>
<body><main><img src="logo.png" alt="ИИщенко LAB"><h1>Открываем личный кабинет</h1><p>Запуск и обновление агента — в кабинете участников клуба. Для доступа войдите через Telegram.</p><a id="cabinet-entry" href="https://club.faktlab.ru/?view=package">Открыть личный кабинет →</a><small>Используйте Telegram-аккаунт, которым оплатили клуб.</small><noscript><p>Автоматический переход отключён. Нажмите кнопку выше.</p></noscript></main><script>(() => {
  const target = new URL('https://club.faktlab.ru/?view=package');
  const values = new URLSearchParams(location.search).getAll('resume');
  if (values.length === 1 && (values[0] === 'new' || values[0] === 'existing')) {
    target.searchParams.set('resume', values[0]);
  }
  document.getElementById('cabinet-entry').href = target.href;
  location.replace(target.href);
})();</script></body></html>
