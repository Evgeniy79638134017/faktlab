<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип шапки — контур разбора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2EC; --ink:#17202B; --deep:#131C2E; --deep-ink:#EDEFF3;
    --deep-muted:#9AA6B8; --accent:#2B37B8; --second:#16776E; --status:#7CAF3A;
    --sans:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--deep);color:var(--deep-ink);font-family:var(--sans);overflow-x:hidden}

  .hero{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(320px,460px) 1fr;
        align-items:center;gap:40px;padding:64px clamp(24px,4vw,72px)}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(60% 55% at 62% 48%, rgba(22,119,110,.18), transparent 70%)}

  .lead{position:relative;z-index:2}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
          color:var(--deep-muted);margin:0 0 18px}
  h1{font-size:clamp(34px,3.4vw,52px);line-height:1.08;margin:0 0 20px;font-weight:600;letter-spacing:-.01em}
  h1 em{font-style:normal;color:var(--status)}
  .sub{font-size:clamp(16px,1.25vw,19px);line-height:1.55;color:var(--deep-muted);margin:0 0 28px;max-width:38ch}
  .cta{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:2px;
       background:var(--status);color:#0E1520;text-decoration:none;font-weight:600;font-size:15px}
  .cta:hover{background:#8FC24A}
  .meta{margin-top:26px;display:flex;gap:28px;font-family:var(--mono);font-size:12px;color:var(--deep-muted)}
  .meta b{display:block;font-size:22px;color:var(--deep-ink);font-weight:500;margin-bottom:4px}

  .stage{position:relative;z-index:1}
  svg{width:100%;height:auto;display:block;overflow:visible}

  .ring{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1}
  .spoke{fill:none;stroke:rgba(255,255,255,.16);stroke-width:1}
  .spoke.out{stroke:rgba(22,119,110,.55)}
  .pulse{fill:var(--status);opacity:.9}
  .agent{fill:rgba(237,239,243,.5)}
  .agent.hot{fill:var(--second)}

  .node text{font-family:var(--sans);font-size:13px;fill:var(--deep-ink)}
  .node .hint{font-family:var(--mono);font-size:10.5px;fill:var(--deep-muted);letter-spacing:.03em}
  .node circle{fill:var(--deep);stroke:rgba(255,255,255,.35);stroke-width:1}
  .node.out circle{stroke:var(--second)}
  .node:hover circle{stroke:var(--status);stroke-width:1.6}
  .node:hover text{fill:#fff}

  .core-label{font-family:var(--mono);font-size:11px;fill:var(--deep-muted);letter-spacing:.08em;text-transform:uppercase}
  .core-name{font-family:var(--sans);font-size:14px;fill:var(--deep-ink);font-weight:500}

  @media (max-width:1080px){
    .hero{grid-template-columns:1fr;padding-top:40px}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="lead">
    <p class="kicker">Разбор и упаковка активов</p>
    <h1>Решения на миллионы принимают на данных, <em>которые никто не собрал</em></h1>
    <p class="sub">Один человек отвечает за выводы. Десятки агентов держат объём: тысячи источников, восемь направлений разбора, готовый пакет за 2–3 недели.</p>
    <a class="cta" href="#">Обсудить задачу →</a>
    <div class="meta">
      <div><b>2–3 нед.</b>срок сборки</div>
      <div><b>8</b>частей пакета</div>
      <div><b>4</b>этапа работы</div>
    </div>
  </div>

  <div class="stage">
    <svg id="scheme" viewBox="0 0 1000 720" role="img" aria-label="Схема разбора актива">
      <defs>
        <clipPath id="face"><circle cx="0" cy="0" r="46"/></clipPath>
      </defs>
      <g id="world">
        <g id="rings"></g>
        <g id="links"></g>
        <g id="agents"></g>
        <g id="nodes"></g>
        <g id="core"></g>
      </g>
    </svg>
  </div>
</section>

<script>
const SVG="http://www.w3.org/2000/svg";
const CX=500, CY=360;

const IN = [
  {t:"Титул и имущество",  h:"что вообще продаётся"},
  {t:"Локация и инженерия",h:"свет, вода, подъезды"},
  {t:"Логистика",          h:"как сюда доедут"},
  {t:"Конкуренты",         h:"с чем вас сравнят"},
  {t:"Сценарии",           h:"подо что это годится"},
  {t:"Рынок и цена",       h:"сколько стоит на самом деле"}
];

const OUT = [
  {t:"Диагностика",        h:"где теряются деньги"},
  {t:"Меморандум",         h:"документ для инвестора"},
  {t:"Книга собственника", h:"всё об активе в одном месте"},
  {t:"Тизер и презентация",h:"первый контакт с покупателем"},
  {t:"Финансовая модель",  h:"на чём зарабатывает"},
  {t:"Сайт-витрина",       h:"отправляется одной ссылкой"},
  {t:"Стратегия и каналы", h:"кто купит и где его искать"},
  {t:"Юридический контур", h:"чтобы сделка не развалилась"}
];

const el=(n,a={})=>{const e=document.createElementNS(SVG,n);for(const k in a)e.setAttribute(k,a[k]);return e};
const pos=(deg,r)=>[CX+Math.cos(deg*Math.PI/180)*r, CY+Math.sin(deg*Math.PI/180)*r];

// кольца-орбиты агентов
const rings=document.getElementById("rings");
[104,132,162].forEach(r=>rings.appendChild(el("circle",{cx:CX,cy:CY,r,class:"ring"})));

// агенты на орбитах
const agents=document.getElementById("agents");
const dots=[];
[[104,14,.00035],[132,18,-.00026],[162,22,.0002]].forEach(([r,n,sp])=>{
  for(let i=0;i<n;i++){
    const a=(360/n)*i, hot=Math.random()<.28;
    const c=el("circle",{r:hot?3:2.2,class:"agent"+(hot?" hot":"")});
    agents.appendChild(c); dots.push({c,r,a,sp});
  }
});

// узлы и лучи
const links=document.getElementById("links"), nodes=document.getElementById("nodes");
const beams=[];

function build(list, from, to, r, out){
  const step=(to-from)/(list.length-1);
  list.forEach((d,i)=>{
    const deg=from+step*i, [x,y]=pos(deg,r);
    const [sx,sy]=pos(deg, out?150:150);
    const path=el("path",{d:`M${x} ${y} L${sx} ${sy}`,class:"spoke"+(out?" out":"")});
    links.appendChild(path);
    beams.push({path,out,len:Math.hypot(x-sx,y-sy),x1:x,y1:y,x2:sx,y2:sy,ph:Math.random()});

    const g=el("g",{class:"node"+(out?" out":"")});
    g.appendChild(el("circle",{cx:x,cy:y,r:5}));
    const anchor=out?"start":"end", dx=out?16:-16;
    const t1=el("text",{x:x+dx,y:y-1,"text-anchor":anchor}); t1.textContent=d.t;
    const t2=el("text",{x:x+dx,y:y+15,"text-anchor":anchor,class:"hint"}); t2.textContent=d.h;
    g.appendChild(t1); g.appendChild(t2); nodes.appendChild(g);
  });
}
build(IN, 152, 208, 330, false);
build(OUT, -74, 74, 330, true);

// ядро — человек
const core=document.getElementById("core");
const cg=el("g",{transform:`translate(${CX},${CY})`});
cg.appendChild(el("circle",{r:56,fill:"none",stroke:"rgba(255,255,255,.28)","stroke-width":1}));
const img=el("image",{href:"../assets/evgeniy.jpg",x:-46,y:-46,width:92,height:92,
                      "clip-path":"url(#face)",preserveAspectRatio:"xMidYMid slice"});
cg.appendChild(img);
const l1=el("text",{y:78,"text-anchor":"middle",class:"core-name"}); l1.textContent="Евгений Ищенко";
const l2=el("text",{y:96,"text-anchor":"middle",class:"core-label"}); l2.textContent="выводы и решения";
cg.appendChild(l1); cg.appendChild(l2);
core.appendChild(cg);

// импульсы по лучам
const pulses=beams.map(b=>{const c=el("circle",{r:2.6,class:"pulse"});links.appendChild(c);return c});

let t=0;
function frame(ts){
  t=ts||0;
  dots.forEach(d=>{
    const a=d.a+t*d.sp*57.3;
    const x=CX+Math.cos(a*Math.PI/180)*d.r, y=CY+Math.sin(a*Math.PI/180)*d.r;
    d.c.setAttribute("cx",x); d.c.setAttribute("cy",y);
  });
  beams.forEach((b,i)=>{
    let k=((t/2600)+b.ph)%1;
    const p=b.out?k:1-k;                       // входы текут к центру, выходы — наружу
    pulses[i].setAttribute("cx", b.x2+(b.x1-b.x2)*(1-p));
    pulses[i].setAttribute("cy", b.y2+(b.y1-b.y2)*(1-p));
    pulses[i].setAttribute("opacity", (Math.sin(k*Math.PI)*.9).toFixed(2));
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// лёгкий параллакс от курсора
const world=document.getElementById("world");
addEventListener("mousemove",e=>{
  const dx=(e.clientX/innerWidth-.5), dy=(e.clientY/innerHeight-.5);
  world.setAttribute("transform",`translate(${(-dx*22).toFixed(1)},${(-dy*16).toFixed(1)})`);
});
</script>
</body>
</html>
