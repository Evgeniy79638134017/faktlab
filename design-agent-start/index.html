<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Запуск агента · Бери Дизайн</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff4f0;color:#17342b;font:17px/1.6 system-ui,sans-serif}
main{width:min(calc(100% - 36px),540px);margin:clamp(22px,12vh,100px) auto;padding:clamp(22px,6vw,38px);border-radius:16px;border:1px solid #d5e0d9;border-top:5px solid #14634e;background:white}
.brand{font-size:14px;font-weight:700;color:#376154}h1{font-size:clamp(27px,6vw,37px);line-height:1.12;margin:9px 0 14px}
button{font:inherit;color:white;background:#14634e;padding:9px 15px;border:0;border-radius:9px;cursor:pointer}
button:focus-visible{outline:3px solid #9c6229;outline-offset:3px}[hidden]{display:none}
</style>
</head>
<body>
<main>
  <p class="brand">Бери Дизайн · ИИщенко LAB</p>
  <h1>Запуск агента</h1>
  <p id="status" role="status">Откройте полную личную ссылку из сообщения.</p>
  <button type="button" id="retry" hidden>Повторить</button>
</main>
<script>
(() => {
const access = new URLSearchParams(location.hash.slice(1)).get('key') || '';
const status = document.getElementById('status');
const retry = document.getElementById('retry');
retry.addEventListener('click', () => location.reload());

async function openRoute() {
  if (!/^[A-Za-z0-9_-]{43}$/.test(access)) return;
  if (!globalThis.crypto?.subtle) {
    status.textContent = 'Откройте личную ссылку в актуальной версии браузера.';
    return;
  }
  status.textContent = 'Открываем ваш маршрут…';
  try {
    const response = await fetch('./route.bin?v=1.1', {referrerPolicy:'no-referrer', credentials:'omit', signal:AbortSignal.timeout(45000)});
    if (!response.ok) throw new Error('network');
    const payload = new Uint8Array(await response.arrayBuffer());
    const raw = Uint8Array.from(atob(access.replace(/-/g,'+').replace(/_/g,'/') + '='), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    let data;
    try {
      data = await crypto.subtle.decrypt({name:'AES-GCM',iv:payload.slice(0,12)}, key, payload.slice(12));
    } catch {
      status.textContent = 'Ссылка не открыла маршрут. Проверьте, что скопировали её целиком из сообщения.';
      return;
    }
    const html = new TextDecoder('utf-8', {fatal:true}).decode(data);
    if (!html.startsWith('<!doctype html>')) throw new Error('data');
    document.open();
    document.write(html);
    document.close();
  } catch {
    status.textContent = 'Маршрут не загрузился. Проверьте интернет и попробуйте снова.';
    retry.hidden = false;
  }
}
if (access) openRoute();
})();
</script>
</body>
</html>
